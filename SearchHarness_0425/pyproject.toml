[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "search-harness"
version = "0.1.0"
description = "Multi-agent deep research evaluation harness (BrowseComp) with trajectory recording for distillation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "requests",
    "httpx",
    "beautifulsoup4",
    "html2text",
    "trafilatura",
    "wikipedia-api",
    "pypdf",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pandas",
    "tqdm",
    "PyYAML>=6.0.0",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = [
    "core",
    "agents",
    "critics",
    "memory",
    "utils",
    "tools",
    "contract",
    "llm",
    "trajectory",
    "pipeline",
    "scripts",
    "scripts.run",
    "scripts.smoke",
    "scripts.analysis",
]

[tool.setuptools.package-data]
llm = ["*.yaml"]
utils = ["*.yaml"]
